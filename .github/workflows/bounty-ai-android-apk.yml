name: BOUNTY AI Android APK (debug)

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/bounty-ai-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile workspace dependencies
        run: pnpm install --frozen-lockfile --filter orca-mobile...

      - name: Generate Android project
        working-directory: mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bounty-ai-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
